      <circle cx="38.4" cy="24.6" r="3.4" />
      <path d="M32 28c-5.5 0-9.2 3.2-9.2 6.7 0 3 2.8 5.5 9.2 5.5s9.2-2.5 9.2-5.5c0-3.5-3.7-6.7-9.2-6.7Z" />
