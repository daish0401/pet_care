  <rect x="474" y="186" width="282" height="48" rx="22" fill="#ffffff" stroke="#d2dde4" stroke-width="1.8" filter="url(#softShadow)" />
  <text class="label-store" x="492" y="217">沐爪宠物洗护店</text>

  <g transform="translate(394 206)" filter="url(#softShadow)">
