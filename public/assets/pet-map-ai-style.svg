  <g transform="translate(38 435)" filter="url(#softShadow)">
    <rect x="0" y="0" width="280" height="52" rx="18" fill="rgba(255,255,255,0.95)" />
    <text x="18" y="32" fill="#134c4a" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="800">
