    <circle cx="328" cy="250" r="9" fill="#9adcb2" />
    <circle cx="351" cy="217" r="7" fill="#9adcb2" />
    <path d="M336 298c8-12 24-12 32 0-8 12-24 12-32 0Z" fill="#a8e4bf" />
