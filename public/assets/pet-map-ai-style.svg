<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">南京汤山若水路宠物风格地图</title>
  <desc id="desc">可爱清新的宠物插画风地图，标记沐爪宠物洗护店位置。</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf9f3" />
      <stop offset="55%" stop-color="#f7fbfa" />
      <stop offset="100%" stop-color="#fff8ec" />
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd8ff" />
      <stop offset="100%" stop-color="#73c8f7" />
    </linearGradient>
    <linearGradient id="parkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cff3d5" />
      <stop offset="100%" stop-color="#ddf8de" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#15393f" flood-opacity="0.2" />
    </filter>
    <style>
      .road-major { stroke: #c7d5dd; stroke-width: 16; fill: none; stroke-linecap: round; }
      .road-minor { stroke: #dbe5eb; stroke-width: 9; fill: none; stroke-linecap: round; }
      .road-small { stroke: #e7eef2; stroke-width: 5; fill: none; stroke-linecap: round; }
      .water { fill: url(#riverGrad); }
      .district-line { stroke: #d2e7da; stroke-width: 4; fill: none; stroke-dasharray: 8 8; opacity: 0.8; }
      .label-main {
        fill: #4c676d;
        font-size: 16px;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        font-weight: 700;
      }
      .label-water {
        fill: #2d9ac3;
        font-size: 15px;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        font-weight: 700;
      }
      .label-store {
        fill: #134c4a;
        font-size: 20px;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        font-weight: 800;
      }
      .poi {
        fill: #ffffff;
        stroke: #b8c9d3;
        stroke-width: 2;
      }
      .poi-dot {
        fill: #82b5ca;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="520" fill="url(#bgGrad)" />

  <path
    d="M0 0H640V520H0Z"
